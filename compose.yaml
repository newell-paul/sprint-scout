services:
  db:
    platform: linux/amd64
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: scout_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scout_demo_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d scout_demo"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  scout_demo_db:
