packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - sharp
# Transitive pins from Tailwind, Vitest and ESLint plugins hold 1.2.1, which
# has a high-severity advisory; drop once they ship 1.2.2 themselves.
overrides:
  # One @types/node across the workspace; msw pulls a newer one through
  # @inquirer, which splits vitest into two incompatible type trees.
  "@types/node": ^22.19.0
  source-map-js: ^1.2.2
  # The rest lift transitive tooling to the patched release in the same major,
  # as reported by the OSV scan; drop each once its parent catches up.
  "@grpc/grpc-js": ^1.14.5
  body-parser@1: ^1.20.9
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  fast-uri@3: ^3.1.8
  ip-address: ^10.7.1
  js-yaml@5: ^5.4.1
  markdown-it: ^14.3.3
  proxy-addr: ^2.0.8
  qs: ^6.16.0
  smol-toml: ^1.9.0
  zod@4: ^4.6.6
  # vite 8.2.2 (via vitest) has a medium advisory fixed in 8.2.4.
  vite: ^8.2.4
  # Lighthouse CI and markdownlint are pinned to old releases that pull these
  # in; the patched ones cross a major but keep the calls those tools make.
  katex: ^0.18.2
  tmp: ^0.2.6
  uuid: ^11.1.1
