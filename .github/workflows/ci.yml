name: Checks
# Pull requests run on their merge ref; a branch push would only repeat that.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      - run: pnpm spell
      - run: pnpm boundaries
      - run: pnpm knip
      - run: pnpm typecheck
      - name: Type coverage
        run: |
          mkdir -p reports
          pnpm typecheck:coverage
          pnpm --silent typecheck:coverage --json-output > reports/type-coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: type-coverage
          path: reports/type-coverage.json
          retention-days: 14
      - run: pnpm audit:prod
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  unit:
    name: Unit and contract (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project unit --shard=${{ matrix.shard }}/2 --reporter=blob --coverage --coverage.reporter=json
        env:
          COVERAGE_GATE: off
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: |
            .vitest-reports
            coverage
          include-hidden-files: true
          retention-days: 1
  unit-report:
    name: Coverage gate
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
      - run: pnpm exec vitest run --merge-reports --coverage --reporter=default --reporter=json --outputFile=reports/unit/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-report
          path: reports/unit
          retention-days: 14
  contract-drift:
    # The only job that talks to the real internet. Advisory: provider drift
    # is reported on the run, not blamed on the pull request.
    name: Open-Meteo contract drift (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract:drift
  vulnerabilities:
    name: OSV scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # A pull request fails only on advisories it adds, so one published
    # overnight does not block unrelated work; main reports everything.
    # Shipped dependencies stay gated by `pnpm audit:prod` in the static job.
    env:
      OSV_IMAGE: ghcr.io/google/osv-scanner-action:v2.7.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Scan
        # An explicit bash adds pipefail, so tee cannot hide the diff's exit 1.
        shell: bash
        run: |
          # osv-scanner exits 1 when it finds advisories; anything else is an error.
          scan() {
            docker run --rm -v "$PWD:/src" -w /src --entrypoint osv-scanner "$OSV_IMAGE" \
              scan --config=osv-scanner.toml "--format=$1" --lockfile="$2" --output-file="$3" || [ $? -eq 1 ]
          }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --quiet HEAD^1 HEAD -- pnpm-lock.yaml; then
              printf '### OSV scan\n\nLockfile unchanged.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            mkdir -p .osv-base
            git show HEAD^1:pnpm-lock.yaml > .osv-base/pnpm-lock.yaml
            scan json .osv-base/pnpm-lock.yaml base.json
            scan json pnpm-lock.yaml head.json
            node scripts/osv-diff.mjs head.json base.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            scan json pnpm-lock.yaml head.json
            scan sarif pnpm-lock.yaml osv.sarif
            node scripts/osv-diff.mjs head.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner
  integration:
    name: Database (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
  component:
    name: Components (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:component --reporter=default --reporter=json --outputFile=reports/component/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: component-report
          path: reports/component
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: component-screenshots
          path: apps/web/app/**/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
  budgets:
    name: Deploy gate (export smoke, size, Lighthouse, perf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:static
      - run: pnpm test:smoke:static
      - run: pnpm test:size
      - run: mkdir -p reports && pnpm exec size-limit --json > reports/size.json
      - run: pnpm test:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-gate-report
          path: |
            reports/size.json
            .lighthouseci/manifest.json
            .lighthouseci/*.report.json
          include-hidden-files: true
          retention-days: 14
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
  e2e:
    name: End to end (shard ${{ matrix.shard }})
    needs: [static, unit, component]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests run against `next start` with the in-memory planner;
      # no database or API build is needed here. A production build means no
      # test waits for a route to compile, as every test did under `next dev`.
      - run: pnpm --filter @scout/web build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
  e2e-report:
    name: End to end report
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - run: pnpm exec playwright merge-reports --reporter json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/e2e/report.json
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: reports/e2e
          retention-days: 14
  dashboard:
    # Built on main only, so the history is one line per landed commit. The
    # Pages workflow runs after this workflow and publishes the page beside
    # the app at /dashboard/.
    name: Engineering dashboard
    needs: [static, unit-report, component, budgets, e2e-report]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      breach: ${{ steps.breach.outputs.breach }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: unit-report
          path: reports/unit
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: component-report
          path: reports/component
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: e2e-report
          path: reports/e2e
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: type-coverage
          path: reports
        continue-on-error: true
      - uses: actions/download-artifact@v8
        with:
          name: deploy-gate-report
          path: .
        continue-on-error: true
      - name: Fetch the latest mutation and eval reports and the previous history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest() { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1" --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty' 2>/dev/null || true; }
          run=$(newest mutation-report)
          [ -n "$run" ] && gh run download "$run" --name mutation-report --dir reports/mutation || true
          run=$(newest evals-report)
          [ -n "$run" ] && gh run download "$run" --name evals-report --dir reports/evals || true
          run=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          [ -n "$run" ] && gh run download "$run" --name dashboard --dir previous || true
          if [ ! -f previous/history.json ]; then
            # First dashboard build after the rename: carry the test health history over.
            [ -n "$run" ] && gh run download "$run" --name test-health --dir previous || true
          fi
      - name: Read pipeline and delivery data from the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/github
          gh run list --workflow ci.yml --branch main --event push --limit 30 \
            --json conclusion,createdAt,updatedAt,attempt > reports/github/runs.json || true
          gh pr list --state merged --limit 100 --json createdAt,mergedAt > reports/github/pulls.json || true
      - name: Collect review tallies and resolved threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect-reviews.mjs || true
      - id: build
        run: pnpm dashboard --history previous/history.json --sha "$GITHUB_SHA"
        continue-on-error: true
      - name: Summary
        if: always()
        run: cat reports/dashboard/bands.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dashboard
          path: reports/dashboard
          retention-days: 90
      - id: breach
        # Read from bands.json rather than the build outcome, so a crash in
        # the build is not reported as a breach.
        if: always()
        run: |
          count=$(jq '[.[] | select(.level == 3)] | length' reports/dashboard/bands.json 2>/dev/null || echo 0)
          echo "breach=$([ "${count:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Fail on a 3σ band breach
        # The dashboard and its history are uploaded first, so the breach is
        # visible on the page as well as on the run. Pages does not publish a
        # failed run.
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::A dashboard metric left its 3σ band. See the job summary and reports/dashboard/bands.md."
          exit 1
  band-issue:
    # A 3σ breach on main becomes one issue per band with a drafted intent
    # (docs/sdlc.md, step 13). Inputs are main only: the dashboard artifact
    # of this run, the repository and its commit messages. The model has
    # read-only tools; the issue is written with the job token. Paid, behind
    # SPEC_ENABLED.
    name: Band breach issue (paid)
    needs: dashboard
    if: always() && needs.dashboard.outputs.breach == 'true' && vars.SPEC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      SPEC_MODEL: ${{ vars.SPEC_MODEL || 'claude-sonnet-5-5' }}
    steps:
      # No token left in .git/config for the model to read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code
      - uses: actions/download-artifact@v8
        with:
          name: dashboard
          path: reports/dashboard
      - name: Draft the intent and open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm band:issue --dashboard reports/dashboard --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-url "$RUN_URL" --model "$SPEC_MODEL"
      - name: Summary
        if: always()
        run: cat reports/band-issue/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: band-issue
          path: reports/band-issue
          retention-days: 30
  band-issue-off:
    name: Band breach issue (off)
    needs: dashboard
    if: always() && needs.dashboard.outputs.breach == 'true' && vars.SPEC_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Band issue"
            echo
            echo "A metric left its 3σ band, but band issues are switched off (repository variable \`SPEC_ENABLED\` is not \`true\`)."
          } >> "$GITHUB_STEP_SUMMARY"
