name: Triage
# Reads the logs of a failed Checks run on a pull request and posts a
# three-line diagnosis (docs/sdlc.md, step 12). workflow_run carries the
# secret even for fork pull requests, so this job checks out the default
# branch only, never runs pull request code, and gives the model read-only
# tools; log text is treated as data. Paid, behind TRIAGE_ENABLED. No
# schedule, by policy.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
permissions: {}
jobs:
  triage:
    name: Diagnose the failed run (paid)
    if: >-
      vars.TRIAGE_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: triage-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      # Default branch only: no ref input, so pull request code is never
      # checked out or run here.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code
      - name: Diagnose and comment
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: pnpm triage --run "$RUN_ID" --repo "$GITHUB_REPOSITORY" --model "$TRIAGE_MODEL"
      - name: Summary
        if: always()
        run: cat reports/triage/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-report
          path: reports/triage
          retention-days: 30
  skipped:
    name: Triage (off)
    if: >-
      vars.TRIAGE_ENABLED != 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Triage"
            echo
            echo "Failed-run triage is switched off (repository variable \`TRIAGE_ENABLED\` is not \`true\`)."
          } >> "$GITHUB_STEP_SUMMARY"
