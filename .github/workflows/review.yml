name: Review
# Applies REVIEW.md to every pull request (docs/sdlc.md, step 11) and runs
# the @claude fix loop. Paid: the review runs only when the repository
# variable REVIEW_ENABLED is "true", never on drafts, forks or Dependabot.
# Findings inform the human decision; nothing here approves, requests
# changes or merges. No schedule, by policy.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions: {}
jobs:
  review:
    name: Review against REVIEW.md (paid)
    if: >-
      github.event_name == 'pull_request' &&
      vars.REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer for this pull request. Read REVIEW.md first and apply it exactly: its three passes, its severities, its exclusions and its output format. Read AGENTS.md for the rules of the repository. If the pull request title or body names an `intent/<slug>/`, read that folder's plan.md and check every proof item against the diff.

            Get the diff with `gh pr diff` and read any file you need in full. Run `pnpm test` only to confirm a suspected defect, never as a substitute for reading.

            Post:
            1. One inline comment per Blocker, Major and Minor finding on the line concerned, using the inline comment tool. State the defect in one sentence and the concrete input or state that triggers it.
            2. One summary comment with `gh pr comment`: findings grouped by severity (file, line, defect, trigger), then the tally line `Tally: N blocker, N major, N minor, N nit`. Nits go only in the summary, at most five, prefer none. If there are no findings, say so in two sentences.

            Never approve, request changes or merge. Do not edit files. Do not comment on files that REVIEW.md excludes.

            Finish by returning the counts of findings per severity, the number of inline comments you posted, and a one-sentence verdict.
          claude_args: |
            --model ${{ env.REVIEW_MODEL }}
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(pnpm test),Bash(pnpm test:*),Read,Glob,Grep"
            --json-schema '{"type":"object","properties":{"blocker":{"type":"integer","minimum":0},"major":{"type":"integer","minimum":0},"minor":{"type":"integer","minimum":0},"nit":{"type":"integer","minimum":0},"inline":{"type":"integer","minimum":0},"verdict":{"type":"string","maxLength":300}},"required":["blocker","major","minor","nit","inline","verdict"]}'
      - name: Tally
        # Validates the structured output and writes the artifact. A malformed
        # answer fails this step so the gap is visible; the workflow is not a
        # required check, so nothing here blocks a merge.
        if: always() && steps.review.outcome != 'skipped'
        env:
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
        run: |
          mkdir -p reports/review
          printf '%s' "$STRUCTURED" > reports/review/structured.json
          pnpm review:tally --structured reports/review/structured.json \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --run "${{ github.run_id }}" --model "$REVIEW_MODEL"
          cat reports/review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-report
          path: reports/review
          retention-days: 90
  skipped:
    name: Review (off)
    if: >-
      github.event_name == 'pull_request' &&
      !(vars.REVIEW_ENABLED == 'true' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - env:
          ENABLED: ${{ vars.REVIEW_ENABLED }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          {
            echo "## Review"
            echo
            if [ "$ENABLED" != "true" ]; then
              echo "The automated review is switched off (repository variable \`REVIEW_ENABLED\` is not \`true\`)."
            elif [ "$DRAFT" = "true" ]; then
              echo "Draft pull request: the review runs when it is marked ready."
            elif [ "$FORK" = "true" ]; then
              echo "Pull request from a fork: the review needs the repository secret and does not run."
            else
              echo "Dependabot pull request: not reviewed by the model."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  fix:
    name: Fix loop (@claude)
    # The action also checks that the commenter has write access; the
    # association test here is a second gate against comments from anyone
    # else on a public repository.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 40
            --allowedTools "Bash(pnpm install:*),Bash(pnpm test),Bash(pnpm test:*),Bash(pnpm lint),Bash(pnpm lint:*),Bash(pnpm typecheck),Bash(pnpm typecheck:*),Bash(pnpm exec vitest:*),Bash(pnpm exec eslint:*),Bash(pnpm exec prettier:*)"
            --append-system-prompt "You are the fix loop of this repository, answering a comment on a pull request. Follow AGENTS.md. Change only what the comment asks for, add or adjust the test that proves it, and run the relevant check before you push. Push to this pull request's branch only: never to main, never a force push, never a new branch, never a workflow dispatch. Never edit files under __aria__ or __screenshots__, never read or write env files. Reply in the thread with what changed and which check you ran."
