name: Mutation
# Manual only: Stryker reruns the unit suite once per mutant, so it is run
# when someone wants a mutation score, not on every pull request.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Incremental: only mutants whose source or tests changed since the last
      # run are re-tested; the previous result file is restored from the cache.
      - uses: actions/cache@v4
        with:
          path: reports/mutation/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 90
