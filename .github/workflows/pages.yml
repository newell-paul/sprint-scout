name: Publish segment planner to GitHub Pages
# Runs once Checks has passed on main, so a failing pull-request gate is never
# published and the dashboard it built is fresh.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  # A manual run refreshes the intent board, which reads open pull requests
  # and their check states.
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # A fork's pull request from a branch named main also matches the branches
    # filter, and its run's dashboard artifact would be published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit whose Checks run passed, not whatever main is now. The
          # job's condition limits this to a push in this repository.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve base path
        # A user/organisation site (<user>.github.io) is served from the root;
        # a project site is served from /<repository name>.
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - run: pnpm --filter @scout/web build:static
      - run: pnpm exec playwright install --with-deps chromium
      # Deploy gate: the export must pass the smoke journeys, the size ceiling
      # and the Lighthouse budgets before it is uploaded.
      - run: pnpm test:smoke:static
      - run: pnpm test:size
      - run: pnpm test:lighthouse
      # The dashboard from the Checks run that triggered this deploy is
      # published beside the app; without it the deploy stops.
      - name: Add the latest engineering dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${{ github.event.workflow_run.id }}"
          if [ -z "$run" ]; then
            # Same query as the dashboard job: a fork's pull request from its
            # own main must not supply the page.
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=dashboard" --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty')
          fi
          # Publishing without it would delete the live dashboard and badges.
          # An empty id must not reach gh, which may then take any run's artifact.
          [ -n "$run" ] || { echo "::error::No unexpired dashboard artifact from main in this repository."; exit 1; }
          gh run download "$run" --name dashboard --dir apps/web/out/dashboard \
            || { echo "::error::Could not download the dashboard from run ${run:-none}."; exit 1; }
      - name: Refresh the intent board
        # The "Rebuild now" link on the board leads here. The rest of the
        # dashboard stays as the last Checks run on main left it.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f apps/web/out/dashboard/history.json ] || exit 0
          node scripts/collect-intents.mjs || echo "::warning::Could not read open pull requests; the board shows main only."
          pnpm exec tsx packages/testing/src/dashboard.cli.ts --refresh-board apps/web/out/dashboard \
            --intents intent --open-intents reports/github/open-intents.json
      - run: touch apps/web/out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
